# Does the live site still serve what this repository contains?
#
# On a SCHEDULE, not on push, deliberately: a divergence caused by a build that
# never completed produces no push, so a push-triggered check cannot see the case
# it exists for. Observed once already -- 40 minutes of stale bytes, noticed only
# because someone happened to curl the URL. See #3.
name: freshness

on:
  # A cron cannot be made reliable by asking harder. Measured on this repository:
  # `*/30` delivered 3 runs in 5h51m where ~12 were requested, with gaps of 2h02m
  # and 3h49m. The drift window this check exists for was 40 MINUTES, so cron alone
  # would most likely have missed it. Hence the event trigger below; the cron is a
  # backstop, not the primary mechanism.
  #
  # '7,37' rather than '*/30': same cadence, off the :00 and :30 minutes where every
  # scheduled job on the platform collides and gets shed first.
  schedule:
    - cron: '7,37 * * * *'

  # `page_build` is GitHub's own event for exactly this: it fires when a push to the
  # Pages publishing source finishes building. This repository uses the legacy Pages
  # build (`build_type: legacy`), which is what emits it.
  #
  # This REPLACES a `workflow_run` trigger on "pages build and deployment", which was
  # measured inert: across two deploys after it was installed -- one at 04:37 and a
  # clean one at 08:08 -- `?event=workflow_run` reported total_count 0. A generated
  # workflow (dynamic/pages/pages-build-deployment) is evidently not matchable by
  # name. It was removed rather than left in place: an inert trigger reads as
  # coverage, which is worse than an absent one.
  #
  # UNVERIFIED in the same way its predecessor was: whether `page_build` actually
  # fires here is not known until observed. If the next deploy produces no
  # page_build-triggered run, cron is the only mechanism and the 40-minute detection
  # target is NOT met -- say that on #3 rather than ticking the criterion.
  page_build:

  workflow_dispatch:

permissions:
  contents: read
  actions: read # to tell a queued deploy from a cancelled one

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # compare the served bytes against main, never against a PR head

      # Exit 0 = in sync, or divergent with a deploy legitimately in flight.
      # Exit 1 = real drift: cancelled, stuck, absent, or a deploy that claims
      #          success while serving different bytes.
      # Exit 3 = the live page could not be fetched -- reported, never passed.
      - name: Compare served bytes against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_freshness.py
